<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0d18">
<title>トマト宇宙農園 — TOMATO STAR FARM</title>
<style>
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    background:#05060c; overflow:hidden;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    color:#dfe6f7; -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  #wrap{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(1200px 700px at 50% 40%, #131a2e 0%, #080a12 55%, #04050a 100%);
  }
  #game{
    display:block; image-rendering:pixelated; image-rendering:crisp-edges;
    box-shadow:0 0 0 2px #2b3a62, 0 0 40px rgba(60,100,180,0.25), 0 18px 60px rgba(0,0,0,0.7);
    border-radius:4px; background:#05060c;
  }
  #loading{
    position:fixed; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; z-index:9;
    background:#05060c;
  }
  #loading .t{ font-size:22px; font-weight:bold; letter-spacing:.08em;
    background:linear-gradient(#ffe9a8,#ff8a72,#e5372f); -webkit-background-clip:text;
    background-clip:text; color:transparent; }
  #loading .s{ font-size:12px; color:#7f8ba8; }
  .dot{ width:8px;height:8px;border-radius:50%;background:#e5372f;display:inline-block;
    animation:b 1s infinite alternate; }
  @keyframes b{ from{transform:translateY(0);opacity:.4} to{transform:translateY(-6px);opacity:1} }
  #rotate{ display:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="336" height="208"></canvas></div>
<div id="loading">
  <div class="t">トマト宇宙農園</div>
  <div class="s">小惑星ソラナムへ 着陸しています…</div>
  <div><span class="dot"></span></div>
</div>

</script>
</body>
</html>
